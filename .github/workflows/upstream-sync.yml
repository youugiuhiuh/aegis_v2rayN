name: Upstream Sync

on:
  schedule:
    # Run daily at 20:00 UTC (04:00 AM UTC+8)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync with upstream/master
    runs-on: ubuntu-latest

    env:
      # Optional PAT (classic `workflow` scope, or fine-grained Workflows: Read and write).
      # GITHUB_TOKEN can never be granted the `workflows` permission, so any push that
      # creates or updates .github/workflows/* is rejected with it. Set SYNC_TOKEN to
      # sync upstream workflow changes too; leave it unset to keep the fork's workflows.
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Remotes & Restore Rerere Cache
        id: setup
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/2dust/v2rayN.git || true
          git fetch origin
          
          mkdir -p /tmp/rerere-cache
          if git show origin/rerere-cache:rr-cache.tar.gz > /tmp/rerere-cache/rr-cache.tar.gz 2>/dev/null && [ -s /tmp/rerere-cache/rr-cache.tar.gz ]; then
            ./scripts/upstream-sync.sh --restore-rerere /tmp/rerere-cache
          else
            rm -f /tmp/rerere-cache/rr-cache.tar.gz
            echo "No existing rerere cache tarball found on origin/rerere-cache."
          fi

      - name: Run Upstream Sync and Rebase
        id: rebase
        run: |
          set -euo pipefail
          PRE_SYNC_SHA=$(git rev-parse HEAD)
          echo "PRE_SYNC_SHA=$PRE_SYNC_SHA" >> "$GITHUB_ENV"
          
          ./scripts/upstream-sync.sh --sync-rebase upstream master
          
          POST_SYNC_SHA=$(git rev-parse HEAD)
          echo "POST_SYNC_SHA=$POST_SYNC_SHA" >> "$GITHUB_ENV"

      - name: Preserve fork workflow files
        if: env.SYNC_TOKEN == ''
        run: |
          set -euo pipefail
          # GITHUB_TOKEN is a GitHub App installation token. GitHub rejects a push that
          # creates or updates .github/workflows/* unless the token carries the `workflows`
          # permission, which GITHUB_TOKEN cannot be granted. Restoring the pre-sync copies
          # keeps the fork's CI definitions and leaves the push with code changes only.
          git rm -r -q --ignore-unmatch .github/workflows
          git checkout "$PRE_SYNC_SHA" -- .github/workflows

          if git diff --cached --quiet; then
            echo "Workflow files already match $PRE_SYNC_SHA."
          else
            git commit -q -m "chore(sync): keep fork workflow files"
            echo "Restored fork workflow files from $PRE_SYNC_SHA."
          fi

          echo "POST_SYNC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Save & Push Rerere Cache
        if: success()
        run: |
          set -euo pipefail
          mkdir -p /tmp/rerere-cache
          ./scripts/upstream-sync.sh --save-rerere /tmp/rerere-cache

          if [ -s /tmp/rerere-cache/rr-cache.tar.gz ]; then
            git fetch origin rerere-cache || true
            if git show-ref --quiet refs/remotes/origin/rerere-cache; then
              git worktree add /tmp/wt-rerere origin/rerere-cache
            else
              git worktree add --orphan -b rerere-cache /tmp/wt-rerere
            fi

            cp /tmp/rerere-cache/rr-cache.tar.gz /tmp/wt-rerere/
            pushd /tmp/wt-rerere
            git add rr-cache.tar.gz
            if ! git diff --staged --quiet; then
              git commit -m "chore(rerere): update rr-cache [skip ci]"
              git push origin HEAD:refs/heads/rerere-cache
              echo "Updated rerere-cache branch successfully."
            else
              echo "No changes in rerere cache to commit."
            fi
            popd
            git worktree remove --force /tmp/wt-rerere
          else
            echo "No rerere cache tarball generated; skipping rerere push."
          fi

      - name: Push Rebased Master
        if: success()
        run: |
          set -euo pipefail
          if [ "$PRE_SYNC_SHA" != "$POST_SYNC_SHA" ]; then
            echo "HEAD moved from $PRE_SYNC_SHA to $POST_SYNC_SHA. Pushing to origin/master..."
            if ! git push --force-with-lease=refs/heads/master:"$PRE_SYNC_SHA" origin HEAD:refs/heads/master; then
              echo "::error::Push to master was rejected. If the git output above mentions 'workflows permission', add a SYNC_TOKEN secret that carries the workflow scope."
              exit 1
            fi
          else
            echo "master is already up to date with upstream."
          fi

      - name: Verify CI path contract
        run: |
          set -o pipefail
          # The workflow snapshots above cannot follow upstream renames, so check that
          # every project path they mention still exists and report the candidates.
          python3 scripts/check-ci-contract.py --report "$RUNNER_TEMP/ci-contract.md"

      - name: Report Sync Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if [ -f "$RUNNER_TEMP/ci-contract.md" ]; then
            ISSUE_TITLE="[Auto-Sync] Workflows reference project paths that upstream renamed"
            HEADLINE="The code sync completed, but the fork's workflow snapshots reference project paths that no longer exist."
            HOWTO=$(cat <<'EOF'
          The sync job cannot repair `.github/workflows/*` itself: `GITHUB_TOKEN` has no
          `workflows` permission, so any workflow change is dropped before the push.

          1. Fix the paths listed below in the affected workflow files.
          2. Push that commit with an SSH key or a token that may modify workflow files.
          3. To remove this class of failure for good: create a PAT with the `workflow`
             scope and store it as the `SYNC_TOKEN` secret. The sync job then pushes
             upstream's workflow updates itself and skips the snapshot step.
          EOF
          )
          elif [ "${{ steps.rebase.outcome }}" = "failure" ]; then
            ISSUE_TITLE="[Auto-Sync] Upstream sync conflict detected"
            HEADLINE="Automated upstream sync failed: \`git rebase upstream/master\` stopped on unresolved code conflicts."
            HOWTO=$(cat <<'EOF'
          1. Checkout `master` locally:
             ```bash
             git fetch upstream master
             git checkout master
             git rebase upstream/master
             ```
          2. Resolve the conflicting files and run:
             ```bash
             git add <resolved-files>
             git rebase --continue
             ```
          3. Push to master (Rerere will remember this resolution for future syncs):
             ```bash
             git push --force-with-lease origin master
             ```
          EOF
          )
          else
            ISSUE_TITLE="[Auto-Sync] Upstream sync push failed"
            HEADLINE="Automated upstream sync rebased cleanly but the push to \`master\` was rejected."
            HOWTO=$(cat <<'EOF'
          The rejection reason is printed in the log of the failed step.

          - `refusing to allow a GitHub App to create or update workflow ...`
            The push token lacks the `workflows` permission, which `GITHUB_TOKEN` cannot be
            granted. Leave the `SYNC_TOKEN` secret unset so the workflow keeps the fork's
            workflow files, or set `SYNC_TOKEN` to a PAT with the `workflow` scope when
            upstream workflow changes should be synced as well.
          - `stale info` / `fetch first`
            `origin/master` moved while the job ran; re-run the workflow.
          EOF
          )
          fi

          BODY=$(cat <<EOF
          ### ⚠️ Upstream Sync Failure

          $HEADLINE

          - **Triggered Commit**: \`${{ github.sha }}\`
          - **Sync Range**: \`${PRE_SYNC_SHA:-unknown}\` -> \`${POST_SYNC_SHA:-unknown}\`
          - **Run URL**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          #### How to Resolve:
          $HOWTO
          EOF
          )

          if [ -f "$RUNNER_TEMP/ci-contract.md" ]; then
            BODY="${BODY}

          $(cat "$RUNNER_TEMP/ci-contract.md")"
          fi

          # Issues may be disabled on the repository; never fail the job over the report itself.
          if ! gh issue list --repo "${{ github.repository }}" --limit 1 >/dev/null 2>&1; then
            echo "::warning::Issues are disabled on this repository; conflict report follows in the log."
            printf '%s\n' "$BODY"
            exit 0
          fi

          EXISTING_ISSUE=$(gh issue list --repo "${{ github.repository }}" --search "$ISSUE_TITLE in:title state:open" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Found existing open conflict issue #$EXISTING_ISSUE. Adding update comment..."
            gh issue comment "$EXISTING_ISSUE" --repo "${{ github.repository }}" --body "$BODY" || printf '%s\n' "$BODY"
          else
            echo "Creating new conflict issue..."
            gh issue create --repo "${{ github.repository }}" --title "$ISSUE_TITLE" --body "$BODY" || printf '%s\n' "$BODY"
          fi
